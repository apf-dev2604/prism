# ============================================================
# 8. DATA QUALITY - AUDIT DATABASE AND TABLES
# ============================================================

[DB_SETTINGS.DQ]
DB_NAME = "iestdbrds"
DB_SCHEMA_NAME = "db_admin"
DQ_TABLE_LIST = [
    "etl_dq_run_summary",
    "etl_source_window_checks",
    "etl_strict_delivery_control",
    "etl_dq_mismatch_detail",
    "etl_dq_column_checks"
]


# ============================================================
# 9. DATA QUALITY - COMPARISON POLICY
# ============================================================

# Store monetary tolerances as strings to preserve decimal
# precision. Python should parse using decimal.Decimal.

DQ_ROW_AMOUNT_TOLERANCE = "0.65"
DQ_TOTAL_AMOUNT_TOLERANCE = "0.01"


