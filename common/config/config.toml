
# ============================================================
# PRISM - GLOBAL CONFIGURATION
# Pipeline for Relational Ingestion and Storage Modernisation
#
# Non-secret configuration only.
# Credentials are stored separately in common/.env.
#
# Required loader:
#   common/config/load_config.sh
#
# Variable references such as $BASE_DIR are resolved
# by load_config.sh, not by TOML itself.
# ============================================================

# ============================================================
# 0. COMMON ETL SETTINGS
# ============================================================

[COMMON_ETL_SETTINGS]
PHT_TIMEZONE = "Asia/Manila"
SOURCE_TIMEZONE = "UTC"

# Lower OS CPU priority where supported. Higher number means lower priority.
ENABLE_OS_NICE = true
OS_NICE_INCREMENT = 10

# Optional safety cap for testing. Use 0 for unlimited/full extract.
MAX_ROWS_TO_EXTRACT = 0

# Disable COUNT(*) by default to avoid extra load on large tables.
ENABLE_SOURCE_COUNT = false

# Retention.
LOCAL_RETENTION_DAYS = 14
LOG_RETENTION_DAYS = 30

SLEEP_SECONDS_BETWEEN_FETCHES = 0.20


# ============================================================
# 1. ROOT AND COMMON DIRECTORIES
# ============================================================

[COMMON_PATHS]

BASE_DIR = "~/scripts/prism"
COMMON_DIR = "$BASE_DIR/common"
SHARED_MODS = "$COMMON_DIR/shared_modules"
CONF_DIR = "$COMMON_DIR/config"
ETL_CONF_FILE = "$CONF_DIR/config.toml"
ENV_FILE = "$COMMON_DIR/.env"


# ============================================================
# 2. PIPELINE DIRECTORIES
# ============================================================

[PIPELINE_DIR]

DIRECT2SILVER_PHASE = "$BASE_DIR/d2s"
GOLD_PHASE = "$BASE_DIR/gold_phase"
BASE_LOG_DIR = "$DIRECT2SILVER_PHASE/logs"
DMP_DIR = "$DIRECT2SILVER_PHASE/daily_dmp/jsonl"
EXTRACT_LOG = "$BASE_LOG_DIR/extract_logs"
EXTRACT_LOCK_FILE = "$BASE_LOG_DIR/extract_egms_gamestx.lock"


# ============================================================
# 3. GLOBAL DATABASE SETTINGS
# ============================================================

[DB_SETTINGS]

DW_DB_HOST = "iest-db-postgresql.cvmg4ca8uhd2.ap-southeast-1.rds.amazonaws.com"
DW_DB_PORT = 5432
DW_DB_ENGINE = "PostgreSQL"
PIPELINE_USER = "dbade_etl_user"


# ============================================================
# 4. SOURCE DATABASE - INPLAY V1 / MYSQL
# ============================================================

[DB_SETTINGS.INPLAY1]

DB_ENGINE = "MySQL"
DB_HOST = "103.253.145.33"
DB_USER = "AllanFaylona"
DB_PORT = 3306
DB_NAME = "Artemis"

GAMETX_TABLENAME = "EGMS_Game_Trans"
GAMETX_BUSINESS_WINDOW_DATE = "GameDate"

WALLETTX_TABLENAME_LIST = [
    "withdrawalTx",
    "depositTx"
]

ALL_TABLE_LIST = [
    "EGMS_Game_Trans",
    "withdrawalTx",
