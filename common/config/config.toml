
# ============================================================
# PRISM - GLOBAL CONFIGURATION
# Pipeline for Relational Ingestion and Storage Modernisation
#
# Non-secret configuration only.
# Credentials are stored separately in common/.env.
#
# Required loader:
#   common/config/load_config.sh
#
# Variable references such as $BASE_DIR are resolved
# by load_config.sh, not by TOML itself.
# ============================================================


# ============================================================
# 1. ROOT AND COMMON DIRECTORIES
# ============================================================

[COMMON_PATHS]

BASE_DIR = "~/scripts/nexus_etl_prod"

COMMON_DIR = "$BASE_DIR/common"
SHARED_MODS = "$COMMON_DIR/shared_modules"
CONF_DIR = "$COMMON_DIR/config"

ETL_CONF_FILE = "$CONF_DIR/config.toml"
ENV_FILE = "$COMMON_DIR/.env"


# ============================================================
# 2. PIPELINE DIRECTORIES
# ============================================================

[PIPELINE_DIR]

DIRECT2SILVER_PHASE = "$BASE_DIR/d2s"
GOLD_PHASE = "$BASE_DIR/gold_phase"

BASE_LOG_DIR = "$DIRECT2SILVER_PHASE/logs"

DMP_DIR = "$DIRECT2SILVER_PHASE/daily_dmp/jsonl"

EXTRACT_LOG = "$BASE_LOG_DIR/extract_logs"
EXTRACT_LOCK_FILE = "$BASE_LOG_DIR/extract_egms_gamestx.lock"


