# Safety controls.
# FETCH_SIZE controls Python memory usage only. It is NOT a total row limit.
FETCH_SIZE = 10000
PROGRESS_LOG_EVERY_ROWS = 100000

# ============================================================
# 5. DESTINATION - RAW DATA LAKE
# ============================================================

[DB_SETTINGS.DW_RAW_DB]
DB_PORT = 5432
DB_NAME = "iestdl"
SCHEMA_NAME = "kemet"
TABLE_NAME = "GameTransactionInplayV1_dmp"


# ============================================================
# 6. DESTINATION - NEXUS STAGING
# ============================================================

[DB_SETTINGS.STG_RAW_DB]
DB_NAME = "iestdbrds"
SCHEMA_NAME = "etl_stage"
GAMESTX_TABLENAME = "gametransaction_prod"


# ============================================================
# 7. DESTINATION - NEXUS PRODUCTION
# ============================================================

[DB_SETTINGS.PRD_RAW_DB]
